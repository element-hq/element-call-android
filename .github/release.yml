changelog:
  # Excluded before anything is categorised, so a PR-Task pull request lands under no heading at all, not
  # even the "*" catch-all under Others. This is the label for work that changes nothing a host could
  # observe: CI plumbing, test-only churn, a repository chore. It is deliberately the only way to keep a
  # merged pull request out of the notes, so "no entry" is a labelled decision a reviewer can see rather
  # than the silent result of leaving the label off. Same as element-call-ios.
  exclude:
    labels:
      - PR-Task

  categories:
    - title: ✨ Features
      labels:
        - PR-Feature
    - title: 🙌 Improvements
      labels:
        - PR-Change
    - title: 🐛 Bugfixes
      labels:
        - PR-Bugfix
    - title: ⚠️ API Changes
      labels:
        - PR-Api
    - title: 🧱 Build
      labels:
        - PR-Build
    - title: 📄 Documentation
      labels:
        - PR-Doc
    - title: 🚧 In development 🚧
      labels:
        - PR-Wip
    - title: Dependency upgrades
      labels:
        - PR-Dependencies
    - title: Others
      labels:
        - PR-misc
        - "*"
