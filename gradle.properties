# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseG1GC

# The published coordinates: io.element.android:element-call-<module>:VERSION_NAME.
# VERSION_NAME is the single source of the library version (semver 0.x); the release workflow refuses
# a tag that does not match it. Override on the command line for a local publication:
# ./gradlew publishToMavenLocal -PVERSION_NAME=0.0.0-local
GROUP=io.element.android
VERSION_NAME=0.1.0-SNAPSHOT

# The matrix-rust-rtc core, published from rtc/local to the LOCAL Maven repository only, under the
# coordinate the plan reserves for the core's own publication (org.matrix.rtc:matrixrtc-android). Bump
# when the AAR in rtc/local changes. Never published to Central from here: see RELEASING.md.
MATRIX_RTC_VERSION=0.0.0-local

# The matrix-rust-rtc release this checkout is validated against, fetched into rtc/local by
# ./tools/rtc/fetch-rust-rtc and checked against the sha256 (docs/local_stack.md, layer 1). Bump both lines
# together; CI validates the bump on the pull request. The fork's release is the interim home until the core
# moves to element-hq/matrix-rust-rtc, when only this URL changes.
MATRIX_RTC_AAR_URL=https://github.com/BillCarsonFr/matrix-rust-rtc/releases/download/v0.2.0-rc.1/matrix-rtc-android-0.2.0-rc.1.aar
MATRIX_RTC_AAR_SHA256=9aefee63a0e2ea5ce7b3a12f220f960e886d9fc1fb9a6c96b0134b358c1ad9e0

# POM metadata shared by every published module (com.vanniktech.maven.publish reads these). Per-module
# POM_ARTIFACT_ID, POM_NAME and POM_DESCRIPTION live in each module's gradle.properties.
POM_INCEPTION_YEAR=2026
POM_URL=https://github.com/element-hq/element-call-android
POM_SCM_URL=https://github.com/element-hq/element-call-android
POM_SCM_CONNECTION=scm:git:git://github.com/element-hq/element-call-android.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/element-hq/element-call-android.git
POM_LICENCE_NAME=GNU Affero General Public License v3.0 only
POM_LICENCE_URL=https://www.gnu.org/licenses/agpl-3.0.html
POM_LICENCE_DIST=repo
POM_DEVELOPER_ID=element
POM_DEVELOPER_NAME=Element
POM_DEVELOPER_URL=https://element.io
# Signing is only turned on by release.yml, with in-memory GPG credentials.
RELEASE_SIGNING_ENABLED=false

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true

org.gradle.configureondemand=true
org.gradle.parallel=true

# Caching
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
kotlin.incremental=true

# Create BuildConfig files as bytecode to avoid Java compilation phase
android.enableBuildConfigAsBytecode=true

# Used to prevent detekt from reusing invalid cached rules
detekt.use.worker.api=true

# Needed after enabling proguard on AGP 8.13.1
android.r8.gradual.support=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
